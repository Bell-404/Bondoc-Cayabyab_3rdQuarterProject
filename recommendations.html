<!DOCTYPE html>
<html>



<head>
    <title>Bell & Audrey's Library</title>
    <meta charset="UTF-8">
    <meta name="author" content="Samantha Isabelle Bondoc">
    <meta name="author" content="Audrey Felicity S. Cayabyab">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="Assets/favicon.ico">
    <link rel="stylesheet" href="Styles/mainstyle.css">
    <link rel="stylesheet" href="Styles/header.css">
    <link rel="stylesheet" href="Styles/medianav.css">
    <link rel="stylesheet" href="Styles/animations.css">
    <link rel="stylesheet" href="Styles/ainfo.css">
    <link rel="stylesheet" href="Styles/recommendations.css">
 
</head>



    <body>
        <!-- Header -->
            <ul class="header">
                <li><img src="Assets/weblogo.png" alt="Webpage Icon" class="weblogo"></li>
                <li class="title"><h3>Audrey & Bell's Library  ⋆｡ﾟ☁︎｡⋆｡ ﾟ☾ ﾟ｡⋆</h3></li>
                <li><a href="minigame.html">Minigame</a></li>
                <li><a href="contactsandaboutus.html">Contacts & About Us</a></li>
                <li><a href="index.html">Home</a></li>
            </ul>
        <!-- End of Header-->

        <!-- Main Content -->
            <h1>Submit your recommendations here!</h1>
            <!-- Form -->
                <form id="recommendationForm">
                        <label for="name">Your Name:</label><br>
                        <input type="text" id="name" name="name" required><br><br>

                        <label for="title">Title:</label><br>
                        <input type="text" id="title" name="title" required><br><br>

                            <label for="mediaType">Media Type:</label><br>
                            <select id="mediaType" name="mediaType" required>
                                <option value="">Select Media Type</option>
                                <option value="book">Book</option>
                                <option value="animation">Animation</option>
                                <option value="music">Music</option>
                            </select><br><br>

                        <label for="description">Description:</label><br>
                        <textarea id="description" name="description" rows="4" cols="50" required></textarea><br><br>

                        <input type="hidden" id="editId" name="editId">
                        <input type="submit" id="submitBtn" value="Submit My Recommendation!">
                        <button type="button" id="cancelBtn" style="display:none;">Cancel Edit</button>
                </form>
            <!-- End of Form -->

            <!-- Recommendations List -->
                <h1>Recommendations List</h1>
                <ul id="recommendationsList">
                </ul>
            <!-- End of Recommendations List -->

        <!-- End of Main Content -->
    </body>

    <script>
        const KEY = 'recommendations';

        // Function to load recommendations from localStorage
        function loadRecommendations() {
            const data = localStorage.getItem(KEY);
            return data ? JSON.parse(data) : [];
        }

        // Function to save recommendations to localStorage
        function saveRecommendations(recommendations) {
            localStorage.setItem(KEY, JSON.stringify(recommendations));
        }

        // Function to render recommendations on the page
        function renderRecommendations() {
            const recommendations = loadRecommendations();
            const list = document.getElementById('recommendationsList');
            list.innerHTML = '';
            recommendations.forEach(function(note) {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${note.name}</strong> - ${note.title} (${note.mediaType})<br>${note.description}
                <button onclick="deleteRecommendation('${note.title}')">Delete</button>
                <button onclick="editRecommendation('${note.title}')">Edit</button>`;
                list.appendChild(li);
            });
        }

        // Get form elements
        const form = document.getElementById('recommendationForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const editId = document.getElementById('editId');

        // Function to reset form to add mode
        function resetFormMode() {
            editId.value = '';
            submitBtn.value = 'Submit My Recommendation!';
            cancelBtn.style.display = 'none';
            form.reset();
        }

        // Handle form submission
        form.onsubmit = function(event) {
            event.preventDefault(); // Prevent form from submitting normally
            const name = document.getElementById('name').value.trim();
            const title = document.getElementById('title').value.trim();
            const mediaType = document.getElementById('mediaType').value;
            const description = document.getElementById('description').value.trim();
            if (!name || !title || !mediaType || !description) {
                alert('Please fill in all fields before submitting.');
                return;
            }
            const recommendations = loadRecommendations();
            if (editId.value) {
                // Edit existing
                const rec = recommendations.find(r => r.title === editId.value);
                if (rec) {
                    rec.name = name;
                    rec.title = title;
                    rec.mediaType = mediaType;
                    rec.description = description;
                }
            } else {
                // Add new
                const note = {
                    name: name,
                    title: title,
                    mediaType: mediaType,
                    description: description
                };
                recommendations.push(note);
            }
            saveRecommendations(recommendations);
            resetFormMode();
            renderRecommendations();
        }

        // Function to delete a recommendation
        function deleteRecommendation(title) {
            let recommendations = loadRecommendations();
            recommendations = recommendations.filter(note => note.title !== title);
            saveRecommendations(recommendations);
            renderRecommendations();
        }

        // Function to edit a recommendation
        function editRecommendation(title) {
            const recommendations = loadRecommendations();
            const rec = recommendations.find(note => note.title === title);
            if (!rec) return;
            document.getElementById('name').value = rec.name;
            document.getElementById('title').value = rec.title;
            document.getElementById('mediaType').value = rec.mediaType;
            document.getElementById('description').value = rec.description;
            editId.value = title;
            submitBtn.value = 'Update Recommendation';
            cancelBtn.style.display = 'inline';
        }

        // Handle cancel edit
        cancelBtn.onclick = resetFormMode;

        // Initial page load render
        renderRecommendations();
    </script>
</html>
