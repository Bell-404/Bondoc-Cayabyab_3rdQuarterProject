<!DOCTYPE html>
<html>



<head>
    <title>Bell & Audrey's Library</title>
    <link rel="icon" type="image/x-icon" href="Assets/weblogo.png">
    <meta charset="UTF-8">
    <meta name="author" content="Samantha Isabelle Bondoc">
    <meta name="author" content="Audrey Felicity S. Cayabyab">
    <link rel="stylesheet" href="Styles/mainstyle.css">
    <link rel="stylesheet" href="Styles/header.css">
    <link rel="stylesheet" href="Styles/medianav.css">
    <link rel="stylesheet" href="Styles/animations.css">
    <link rel="stylesheet" href="Styles/ainfo.css">
    <link rel="stylesheet" href="Styles/recommendations.css">
 
</head>



    <body>
        <!-- Header -->
            <ul class="header">
                <li><img src="Assets/weblogo.png" alt="Webpage Icon" class="weblogo"></li>
                <li class="title"><h3>Audrey & Bell's Library  ⋆｡ﾟ☁︎｡⋆｡ ﾟ☾ ﾟ｡⋆</h3></li>
                <li><a href="construction.html">Lounge</a></li>
                <li><a href="contactsandaboutus.html">Contacts & About Us</a></li>
                <li><a href="index.html">Home</a></li>
            </ul>
        <!-- End of Header-->

        <!-- Main Content -->
            <h1>Submit your recommendations here!</h1>
            <!-- Form -->
                <form>
                        <label for="name">Your Name:</label><br>
                        <input type="text" id="name" name="name" required><br><br>

                        <label for="title">Title:</label><br>
                        <input type="text" id="title" name="title" required><br><br>

                            <label for="mediaType">Media Type:</label><br>
                            <select id="mediaType" name="mediaType" required>
                                <option value="">Select Media Type</option>
                                <option value="book">Book</option>
                                <option value="movie">Movie</option>
                                <option value="tvshow">TV Show</option>
                                <option value="music">Music</option>
                            </select><br><br>

                        <label for="description">Description:</label><br>
                        <textarea id="description" name="description" rows="4" cols="50" required></textarea><br><br>

                        <input type="submit" value="Submit My Recommendation!">
                </form>
            <!-- End of Form -->

            <!-- Recommendations List -->
                <h1>Recommendations List</h1>
                <ul id="recommendationsList"></ul>
                <button id='delete_recommendations' onclick = 'deleteRecommendations()'> Delete recommendation </button>
            <!-- End of Recommendations List -->

        <!-- End of Main Content -->
    </body>

    <script>  
    //button appearance
const button = document.getElementById('delete_recommendations');
button.textContent = "Delete all recommendations";
button.style.color= 'black';

//sucessfully deletes items from local storage
        function deleteRecommendations() {
    localStorage.removeItem('recommendations');
    
}

     // handle form submission and save data to local storage
        const form = document.querySelector('form');
        const recommendationsList = document.getElementById('recommendationsList');

        // render page with saved recommendations from local storage   
        function loadRecommendations() {
            let recommendations = JSON.parse(localStorage.getItem('recommendations')) || [];
            recommendations.forEach(rec => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `<strong>${rec.name}</strong> recommends "<strong>${rec.title}</strong>" (${rec.mediaType}): <i>${rec.description}</i> <br><br> `;
                recommendationsList.appendChild(listItem);
            });
        }


             

        // Load recommendations when the page loads
        loadRecommendations();

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const title = document.getElementById('title').value;
            const mediaType = document.getElementById('mediaType').value;
            const description = document.getElementById('description').value;

            const recommendationData = {
                name,
                title,
                mediaType,
                description
            };  

            
        //changes by audrey
       // Save recommendation to local storage
            let array_of_objects_test = []; //added by audrey -  an array for objects
            array_of_objects_test.push(recommendationData); //added by audrey - add objects to array
            localStorage.setItem('recommendations', JSON.stringify(array_of_objects_test)); //added by audrey - save array of objects to local storage
            //after testing the localStorage does get updated, to the current new value but the previous value are not saved, so the only value is the new one
     //changes by audrey

     //original code before changes by audrey
    //  let recommendations = JSON.parse(localStorage.getItem('recommendations')) || [];
    //         recommendations.push(recommendationData);
    //         localStorage.setItem('recommendations', JSON.stringify(recommendations));

            // Add recommendation to the list
            const listItem = document.createElement('li');
            listItem.textContent = `${name} recommends "${title}" (${mediaType}): ${description}`;
            

            
            recommendationsList.appendChild(listItem);

            // Clear the form
            form.reset();
        })

 
    </script>
</html>
