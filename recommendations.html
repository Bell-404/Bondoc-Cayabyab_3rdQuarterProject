                        <label for="name">Your Name:</label><br>

                            <label for="mediaType">Media Type:</label><br>

                                <option value="tvshow">TV Show</option>
                                <option value="music">Music</option>
                            </select><br><br>

                        <label for="description">Description:</label><br>

                        <input type="submit" value="Submit My Recommendation!">

    <script>  
        // helpers for localstorage
        const KEY = 'recommendations';

        function loadRecommendations() {
            const raw = localStorage.getItem(KEY);
            return raw ? JSON.parse(raw) : [];
        }

        function saveRecommendations(recommendations) {
            localStorage.setItem(KEY, JSON.stringify(recommendations));
        }

        // rendering list to page
        function renderRecommendations() {
            const recommendations = loadRecommendations();
            const list = document.getElementById('recommendationsList');
            if (recommendations.length === 0) {
                list.innerHTML = '<li>No recommendations yet</li>';
                return;
            }
            list.innerHTML = notes.map((n,i) => //use index for delete and edit reference
                `<li>
                    ${n.name} recommends ${n.title} (${n.mediaType}): ${n.description}
                    <button onclick="EditRecommendation(${i})">Edit</button>
                    <button onclick="DeleteRecommendation(${i})">Delete</button>
                </li>`
            ).join('');
        }

        // form handling
        const form = document.getElementById("recommendationForm");
        form.onsubmit = e => {
            e.preventDefault(); //prevent page refresh on form submit
            const name = document.getElementById("name").value.trim();
            const note = document.getElementById("description").value.trim();
            const title = document.getElementById("title").value.trim();
            const mediaType = document.getElementById("mediaType").value;
            if (!name || !note || !title || !mediaType) {
                alert("Please fill in all fields.");
                return;
            }
            const object = { name, title, mediaType, description: note }; //create recommendation object
            const recommendations = loadRecommendations();
            recommendations.push(object); //add new recommendation to list
            saveRecommendations(recommendations); //save updated list to localStorage
            form.reset(); //clear form
            renderRecommendations(); //re-render list to page
        }
        
        //delete item from localStorage by index
        function deletRecommendation(i) {
            const recommendations = loadRecommendations();
            recommendations.splice(i, 1); //remove item at index i
            saveRecommendations(recommendations); //save updated list to localStorage
            renderRecommendations(); //re-render list to page
        }

        //edit item from localStorage by index
        function editRecommendations(i) {
            const recommendation = loadRecommendations();
            const newName = prompt("Edit name:", recommendation[i].name);
            const newTitle = prompt("Edit title:", recommendation[i].title);
            const newMediaType = prompt("Edit media type:", recommendation[i].mediaType);
            const newDescription = prompt("Edit description:", recommendation[i].description);
            if (newName && newTitle && newMediaType && newDescription) {
                recommendation[i] = { name: newName, title: newTitle, mediaType: newMediaType, description: newDescription }; //update recommendation object
                saveRecommendations(recommendation); //save updated list to localStorage
                renderRecommendations(); //re-render list to page
            } else {
                alert("All fields must be filled out to edit the recommendation.");
            }
        }

        //initial render of recommendations list on page load
        renderRecommendations();
 
    </script>
